name: Build et Release Launcher

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install minecraft-launcher-lib pyinstaller pillow
      - name: Compiler pour Windows
        run: |
          python -m PyInstaller --onefile --noconsole --icon=icone.ico --add-data "icone.ico;." --name "Manille-et-Mathis-Windows" launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: Launcher-Windows
          path: "dist/Manille-et-Mathis-Windows.exe"

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dependances
        run: |
          python3 -m pip install --upgrade pip
          pip3 install minecraft-launcher-lib pyinstaller pillow
      - name: Compiler pour macOS
        run: |
          python3 -m PyInstaller --onedir --windowed --icon=icone.ico --add-data "icone.ico:." --name "Manille et Mathis" launcher.py
          cd dist && zip -r "Manille-et-Mathis-macOS.zip" "Manille et Mathis.app"
      - uses: actions/upload-artifact@v4
        with:
          name: Launcher-macOS
          path: "dist/Manille-et-Mathis-macOS.zip"

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dependances
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python3 -m pip install --upgrade pip
          pip3 install minecraft-launcher-lib pyinstaller pillow
      - name: Compiler pour Linux
        run: |
          python3 -m PyInstaller --onefile --noconsole --add-data "icone.ico:." --name "Manille-et-Mathis-Linux" launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: Launcher-Linux
          path: "dist/Manille-et-Mathis-Linux"

  publier-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les 3 fichiers compiles
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publier dans GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Launcher Manille et Mathis"
          body: "Téléchargez la version correspondant à votre système d'exploitation ci-dessous :"
          files: release-files/*
          prerelease: false

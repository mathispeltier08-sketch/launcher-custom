name: Build launcher multi-OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: pip install pyinstaller pillow certifi minecraft-launcher-lib
      - name: Compiler Windows
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --noupx --name launcher --icon "icone.ico" --add-data "fond_anniversaire.png;." --add-data "logo.png;." --collect-all certifi --collect-all minecraft_launcher_lib --hidden-import PIL._imagingtk --hidden-import PIL._tkinter_finder launcher.py
      - name: Installer Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Créer le setup
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'
      - name: Publier Windows
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          path: installer/Manille-et-Mathis-Launcher-Setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer Tkinter et les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev
      - name: Installer les dépendances Python
        run: pip install pyinstaller pillow certifi minecraft-launcher-lib
      - name: Compiler Linux
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --noupx \
            --name launcher \
            --add-data "fond_anniversaire.png:." \
            --add-data "logo.png:." \
            --collect-all certifi \
            --collect-all minecraft_launcher_lib \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageTk \
            --hidden-import PIL._imagingtk \
            --hidden-import PIL._tkinter_finder \
            launcher.py
          chmod +x dist/launcher
      - name: Publier Linux
        uses: actions/upload-artifact@v4
        with:
          name: launcher-linux
          path: dist/launcher
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: pip install pyinstaller pillow certifi minecraft-launcher-lib
      - name: Compiler macOS
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --noupx \
            --name launcher \
            --add-data "fond_anniversaire.png:." \
            --add-data "logo.png:." \
            --collect-all certifi \
            --collect-all minecraft_launcher_lib \
            --hidden-import PIL._imagingtk \
            --hidden-import PIL._tkinter_finder \
            launcher.py
          ditto -c -k --sequesterRsrc --keepParent dist/launcher.app dist/Manille-et-Mathis-Launcher-macOS.zip
      - name: Publier macOS
        uses: actions/upload-artifact@v4
        with:
          name: launcher-macos
          path: dist/Manille-et-Mathis-Launcher-macOS.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [windows, linux, macos]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publier la release automatique
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build
          name: Build automatique multi-OS
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: release-files/*

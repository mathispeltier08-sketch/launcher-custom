name: Build launcher
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: pip install pyinstaller pillow certifi minecraft-launcher-lib
      - name: Compiler
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --noupx --name launcher --icon "icone.ico" --add-data "fond_anniversaire.png;." --add-data "logo.png;." --collect-all certifi --collect-all minecraft_launcher_lib launcher.py
      - name: Installer Inno Setup
        shell: powershell
        run: choco install innosetup -y
      - name: Créer le setup
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'
      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build
          name: Build automatique
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: installer/Manille-et-Mathis-Launcher-Setup.exe

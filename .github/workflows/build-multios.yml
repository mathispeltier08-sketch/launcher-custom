name: Build launcher multi-OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: pip install pyinstaller pillow certifi minecraft-launcher-lib
      - name: Compiler Windows
        shell: powershell
        run: pyinstaller --noconfirm --clean --onedir --windowed --noupx --name launcher --icon "icone.ico" --add-data "fond_anniversaire.png;." --add-data "logo.png;." --collect-all certifi --collect-all minecraft_launcher_lib launcher.py
      - name: Installer Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Créer le setup Windows
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'
      - name: Publier Windows dans la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build
          name: Build automatique multi-OS
          prerelease: true
          make_latest: false
          files: installer/Manille-et-Mathis-Launcher-Setup.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer Tkinter
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev
      - name: Installer les dépendances
        run: pip install pyinstaller pillow certifi minecraft-launcher-lib
      - name: Compiler Linux
        run: |
          pyinstaller \
            --noconfirm --clean --onefile --windowed --noupx \
            --name Manille-et-Mathis-Launcher-Linux \
            --add-data "fond_anniversaire.png:." \
            --add-data "logo.png:." \
            --collect-all certifi \
            --collect-all minecraft_launcher_lib \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageTk \
            --hidden-import PIL._imagingtk \
            --hidden-import PIL._tkinter_finder \
            launcher.py
          chmod +x dist/Manille-et-Mathis-Launcher-Linux
          tar -C dist -czf Manille-et-Mathis-Launcher-Linux.tar.gz Manille-et-Mathis-Launcher-Linux
          sha256sum Manille-et-Mathis-Launcher-Linux.tar.gz > Manille-et-Mathis-Launcher-Linux.tar.gz.sha256
          ls -lh Manille-et-Mathis-Launcher-Linux.tar.gz
      - name: Vérifier l'archive Linux
        run: tar -tzf Manille-et-Mathis-Launcher-Linux.tar.gz
      - name: Publier Linux dans la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build
          name: Build automatique multi-OS
          prerelease: true
          make_latest: false
          files: |
            Manille-et-Mathis-Launcher-Linux.tar.gz
            Manille-et-Mathis-Launcher-Linux.tar.gz.sha256

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: pip install pyinstaller pillow certifi minecraft-launcher-lib
      - name: Compiler macOS
        run: |
          pyinstaller --noconfirm --clean --windowed --noupx --name launcher --add-data "fond_anniversaire.png:." --add-data "logo.png:." --collect-all certifi --collect-all minecraft_launcher_lib launcher.py
          ditto -c -k --sequesterRsrc --keepParent dist/launcher.app Manille-et-Mathis-Launcher-macOS.zip
      - name: Publier macOS dans la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build
          name: Build automatique multi-OS
          prerelease: true
          make_latest: false
          files: Manille-et-Mathis-Launcher-macOS.zip

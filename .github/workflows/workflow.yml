name: Build launcher multi-OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances Python
        run: pip install pyinstaller pillow certifi minecraft-launcher-lib

      - name: Compiler Windows
        shell: powershell
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --noupx `
            --name launcher `
            --icon "icone.ico" `
            --add-data "fond_anniversaire.png;." `
            --add-data "logo.png;." `
            --collect-all certifi `
            --collect-all minecraft_launcher_lib `
            --hidden-import PIL._imagingtk `
            --hidden-import PIL._tkinter_finder `
            launcher.py

      - name: Installer Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Créer le setup Windows
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'

      - name: Créer le SHA-256 Windows
        shell: powershell
        run: |
          $file = "installer/Manille-et-Mathis-Launcher-Setup.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  Manille-et-Mathis-Launcher-Setup.exe" | Out-File -Encoding ascii "$file.sha256"

      - name: Publier Windows dans la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build
          name: Build automatique multi-OS
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            installer/Manille-et-Mathis-Launcher-Setup.exe
            installer/Manille-et-Mathis-Launcher-Setup.exe.sha256

  linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev libfuse2 desktop-file-utils file

      - name: Installer les dépendances Python
        run: pip install pyinstaller pillow certifi minecraft-launcher-lib

      - name: Compiler le binaire Linux
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --noupx \
            --name manille-et-mathis-launcher \
            --add-data "fond_anniversaire.png:." \
            --add-data "logo.png:." \
            --collect-all certifi \
            --collect-all minecraft_launcher_lib \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageTk \
            --hidden-import PIL._imagingtk \
            --hidden-import PIL._tkinter_finder \
            launcher.py
          chmod +x dist/manille-et-mathis-launcher

      - name: Préparer l'AppDir
        run: |
          rm -rf ManilleEtMathis.AppDir
          mkdir -p ManilleEtMathis.AppDir/usr/bin
          mkdir -p ManilleEtMathis.AppDir/usr/share/applications
          mkdir -p ManilleEtMathis.AppDir/usr/share/icons/hicolor/256x256/apps

          cp dist/manille-et-mathis-launcher ManilleEtMathis.AppDir/usr/bin/manille-et-mathis-launcher

          cat > ManilleEtMathis.AppDir/AppRun <<'APP'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/manille-et-mathis-launcher" "$@"
          APP
          chmod +x ManilleEtMathis.AppDir/AppRun

          cat > ManilleEtMathis.AppDir/manille-et-mathis-launcher.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Manille et Mathis Launcher
          Comment=Launcher Minecraft Manille et Mathis
          Exec=manille-et-mathis-launcher
          Icon=manille-et-mathis-launcher
          Categories=Game;
          Terminal=false
          DESKTOP

          cp ManilleEtMathis.AppDir/manille-et-mathis-launcher.desktop \
            ManilleEtMathis.AppDir/usr/share/applications/manille-et-mathis-launcher.desktop

          if [ -f logo.png ]; then
            cp logo.png ManilleEtMathis.AppDir/manille-et-mathis-launcher.png
            cp logo.png ManilleEtMathis.AppDir/usr/share/icons/hicolor/256x256/apps/manille-et-mathis-launcher.png
          else
            echo "logo.png est requis pour l'icône AppImage"
            exit 1
          fi

      - name: Télécharger appimagetool
        run: |
          curl -L --fail --retry 3 \
            -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Construire l'AppImage
        env:
          ARCH: x86_64
        run: |
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            ManilleEtMathis.AppDir \
            Manille-et-Mathis-Launcher-Linux-x86_64.AppImage
          chmod +x Manille-et-Mathis-Launcher-Linux-x86_64.AppImage
          file Manille-et-Mathis-Launcher-Linux-x86_64.AppImage
          sha256sum Manille-et-Mathis-Launcher-Linux-x86_64.AppImage \
            > Manille-et-Mathis-Launcher-Linux-x86_64.AppImage.sha256

      - name: Publier l'AppImage Linux dans la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build
          name: Build automatique multi-OS
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            Manille-et-Mathis-Launcher-Linux-x86_64.AppImage
            Manille-et-Mathis-Launcher-Linux-x86_64.AppImage.sha256

  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances Python
        run: pip install pyinstaller pillow certifi minecraft-launcher-lib

      - name: Vérifier l'architecture Intel
        run: |
          uname -m
          test "$(uname -m)" = "x86_64"

      - name: Compiler macOS Intel
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --noupx \
            --target-architecture x86_64 \
            --name launcher \
            --add-data "fond_anniversaire.png:." \
            --add-data "logo.png:." \
            --collect-all certifi \
            --collect-all minecraft_launcher_lib \
            --hidden-import PIL._imagingtk \
            --hidden-import PIL._tkinter_finder \
            launcher.py

          file dist/launcher.app/Contents/MacOS/launcher
          file dist/launcher.app/Contents/MacOS/launcher | grep -q "x86_64"

          ditto -c -k --sequesterRsrc --keepParent \
            dist/launcher.app \
            Manille-et-Mathis-Launcher-macOS-Intel.zip

          shasum -a 256 Manille-et-Mathis-Launcher-macOS-Intel.zip \
            > Manille-et-Mathis-Launcher-macOS-Intel.zip.sha256

      - name: Publier macOS Intel dans la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build
          name: Build automatique multi-OS
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            Manille-et-Mathis-Launcher-macOS-Intel.zip
            Manille-et-Mathis-Launcher-macOS-Intel.zip.sha256
